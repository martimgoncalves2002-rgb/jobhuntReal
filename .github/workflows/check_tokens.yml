name: Check tokens

# Manual only — click "Run workflow" in the Actions tab, then read the log.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Check which ATS tokens are live
        run: python check_tokens.py
